[project]
name = "rappi-purchasing-agent"
version = "0.1.0"
description = "AI purchasing agent: investigate, decide, act and verify purchasing decisions."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "openai>=1.40",
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "vulture>=2.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shared*", "read_api*", "write_api*", "mock_supplier*", "evals*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "B", "SIM", "UP", "RET", "PIE", "C4", "I"]
ignore = ["B008", "E501"]  # B008: FastAPI Depends(...) pattern; E501: the formatter owns line width, long prose strings stay whole

[tool.ruff.lint.isort]
known-first-party = ["shared", "read_api", "write_api", "mock_supplier", "evals", "tests"]

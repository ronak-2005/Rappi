id: s3_one_day_noise
scenario: S3
title: "One huge day (a bulk order), otherwise normal"
description: >
  Yesterday's sales were 2.6× the forecast because of one large order; every other day matched the forecast. The plan should not change.
today: 2026-11-02
now_hour: 10

world:
  nodes:
    - {id: CHAP, name: Chapinero, city: Bogotá}
  storage_zones:
    - {node: CHAP, zone: chilled, capacity_l: 1600, other_skus_used_l: 600}
  skus:
    - {id: MILK1L, name: "Whole milk 1L", category: dairy, zone: chilled, unit_volume_l: 1.0,
       shelf_life_days: 14, criticality: high, unit_margin: 0.40, review_period_days: 7}
  inventory:
    - {node: CHAP, sku: MILK1L, on_hand: 400, last_counted_days_ago: 1, remaining_shelf_life_days: 8}
  forecasts:
    - {node: CHAP, sku: MILK1L, units_per_day: 100, sigma: 30, days: 30}
  sales_history:
    - {node: CHAP, sku: MILK1L, daily: [97, 104, 99, 95, 108, 102, 96, 101, 99, 103, 94, 100, 105, 260]}
  suppliers:
    - {id: SUP_A, name: "Andes Dairy", fill_rate: 0.97, on_time_rate: 0.95, cutoff_hour: 14}
  supplier_terms:
    - {supplier: SUP_A, sku: MILK1L, unit_cost: 1.20, moq: 500, case_pack: 20, lead_time_days: 3,
       remaining_shelf_life_days: 12}
  open_pos:
    - {id: PO-4001, node: CHAP, sku: MILK1L, supplier: SUP_A, qty: 800, unit_cost: 1.20,
       arrives_in_days: 2, ordered_days_ago: 1, remaining_shelf_life_days: 12}
  budgets:
    - {node: CHAP, category: dairy, total: 2000, committed: 480}

trigger:
  type: demand_alert
  demand_alert:
    id: AL-OISE
    node: CHAP
    sku: MILK1L
    message: "Yesterday's sales of MILK1L at CHAP were 2.6x the forecast."

expected:
  decision: [accept]
  qty_range: [0, 0]
  required_tools: [get_sales_history, get_promotions, analyze_demand, get_open_pos, get_inventory]
  approval_required: false
  pos_created: 0
  notes: |
    analyze_demand: 1 elevated day (yesterday), rest at forecast → one_off_spike: keep the forecast.
    Need = 1000 + 157 − (400 + 800 PO) = −43 → keep the plan.
    Day 2 storage = 200 + 800 = 1000 L ≤ 1000 L. Day-9 close = 1200 − 1000 = 200 ≥ 157.
    Naive 7-day average (≈123/day) → need ≈ 187 → MOQ 500 bought for nothing.

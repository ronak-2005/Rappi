  storage_zones:
    - {node: CHAP, zone: chilled, capacity_l: 1400, other_skus_used_l: 600}   # 800 L free
  skus:
    - {id: MILK1L, name: "Whole milk 1L", category: dairy, zone: chilled, unit_volume_l: 1.0,
       shelf_life_days: 14, criticality: high, unit_margin: 0.40, review_period_days: 7}
  inventory:
    - {node: CHAP, sku: MILK1L, on_hand: 400, last_counted_days_ago: 1, remaining_shelf_life_days: 8}
  forecasts:
    - {node: CHAP, sku: MILK1L, units_per_day: 150, sigma: 40, days: 30}
  sales_history:
    - {node: CHAP, sku: MILK1L, daily: [146, 155, 149, 158, 141, 152, 150, 147, 153, 149, 156, 144, 151, 148]}
  suppliers:
    - {id: SUP_A, name: "Andes Dairy", fill_rate: 0.97, on_time_rate: 0.95, cutoff_hour: 14}
  supplier_terms:
    - {supplier: SUP_A, sku: MILK1L, unit_cost: 1.20, moq: 200, case_pack: 20, lead_time_days: 2,
       remaining_shelf_life_days: 12}

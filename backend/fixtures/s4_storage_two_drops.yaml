id: s4_storage_two_drops
scenario: S4
title: "Right quantity, but it doesn't fit in the chilled room on delivery day"
description: >
  The recommended 1,160 units is the correct total, but the chilled room only has 800 L free.
  One delivery would overflow it. The agent should split the order into two scheduled drops.
today: 2026-11-02
now_hour: 10


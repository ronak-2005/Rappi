trigger:
  type: recommendation
  recommendation: {id: REC-401, node: CHAP, sku: MILK1L, qty: 1160, supplier: SUP_A}

expected:
  decision: [modify]
  qty_range: [1140, 1180]
  lines: 2
  supplier: SUP_A
  required_tools: [get_inventory, get_storage_status, get_supplier_terms]
  approval_required: false
  pos_created: 2
  final_verification: [OK]
  key_factors: [storage]
  notes: |
    Horizon = 2 + 7 = 9 days → demand 1350. SS = 1.65 × √(9 × 40²) = 198.
    Need = 1350 + 198 − 400 = 1148 → case 20 → 1160 (the recommendation is right).
    One drop on day 2: 100 + 1160 = 1260 L > 800 L free → hard fail.
    Drop 1 day 2: 700 (100 + 700 = 800 L). Closes: d2 650, d3 500, d4 350, d5 200.
    Drop 2: 460. Day 5 → 350 + 460 = 810 L (too much); day 6 → 200 + 460 = 660 L OK.
    Without drop 2, day 6 close = 50 < SS, so day 6 is the only feasible day.
    Day-8 close = 400 + 1160 − 1350 = 210 ≥ 198.

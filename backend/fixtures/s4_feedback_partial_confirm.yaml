id: s4_feedback_partial_confirm
scenario: S4
title: "Supplier confirms only half of the agent's PO"
description: >
  Same situation as s1_modify_open_po_ignored: the agent correctly orders 500 from Andes Dairy,
  but the supplier confirms only 250. Verification must catch the resulting stockout risk and the
  agent must re-plan with the second supplier for the remaining gap.
today: 2026-11-02
now_hour: 10

world:
  nodes:
    - {id: CHAP, name: Chapinero, city: Bogotá}
  storage_zones:
    - {node: CHAP, zone: chilled, capacity_l: 1600, other_skus_used_l: 600}   # 1000 L free
  skus:
    - {id: MILK1L, name: "Whole milk 1L", category: dairy, zone: chilled, unit_volume_l: 1.0,
       shelf_life_days: 14, criticality: high, unit_margin: 0.40, review_period_days: 7}
  inventory:
    - {node: CHAP, sku: MILK1L, on_hand: 300, last_counted_days_ago: 1, remaining_shelf_life_days: 6}
  forecasts:
    - {node: CHAP, sku: MILK1L, units_per_day: 100, sigma: 30, days: 30}
  sales_history:
    - {node: CHAP, sku: MILK1L, daily: [97, 104, 99, 95, 108, 102, 96, 101, 99, 103, 94, 100, 105, 98]}
  suppliers:
    - {id: SUP_A, name: "Andes Dairy", fill_rate: 0.97, on_time_rate: 0.95, cutoff_hour: 14}
    - {id: SUP_B, name: "Lácteos del Valle", fill_rate: 0.95, on_time_rate: 0.93, cutoff_hour: 15}
  supplier_terms:
    - {supplier: SUP_A, sku: MILK1L, unit_cost: 1.20, moq: 500, case_pack: 20, lead_time_days: 3,
       remaining_shelf_life_days: 12}
    - {supplier: SUP_B, sku: MILK1L, unit_cost: 1.35, moq: 100, case_pack: 20, lead_time_days: 2,
       remaining_shelf_life_days: 12}
  open_pos:
    - {id: PO-1001, node: CHAP, sku: MILK1L, supplier: SUP_A, qty: 400, unit_cost: 1.20,
       arrives_in_days: 2, ordered_days_ago: 1, remaining_shelf_life_days: 12}
  budgets:
    - {node: CHAP, category: dairy, total: 1180, committed: 480}

trigger:
  type: recommendation
  recommendation: {id: REC-405, node: CHAP, sku: MILK1L, qty: 800, supplier: SUP_A}

supplier_behaviour:
  SUP_A: {mode: partial, ratio: 0.5, apply_to: first}
  SUP_B: {mode: confirm}

expected:
  decision: [modify]
  qty_range: [500, 500]
  lines: 1
  supplier: SUP_A
  required_tools: [get_inventory, get_open_pos, get_supplier_terms, get_budget, get_storage_status]
  approval_required: false
  pos_created: 2
  supplier_orders: 2
  final_verification: [OK]
  recovery: replan
  replan_qty_range: [200, 280]
  key_factors: [open_po_ignored, partial_confirmation, alternate_supplier]
  notes: |
    First plan: 500 from SUP_A (see s1_modify_open_po_ignored; 800 → 1200 L > 1000 L free and $960 > $700).
    SUP_A confirms 250 → day-9 close = 300 + 400 + 250 − 1000 = −50 → lost sales → UNACCEPTABLE.
    Replan: position 950 → need 1157 − 950 = 207 → SUP_B (MOQ 100, case 20) → 220, arrives day 2.
    Budget left after partial: 700 − 300 = 400 ≥ 220 × 1.35 = 297.
    Storage: day 2 = 100 + 400 + 220 = 720 L; day 3 = 620 + 250 = 870 L ≤ 1000 L.
    Day-9 close = 300 + 400 + 250 + 220 − 1000 = 170 ≥ 157 → OK.

id: s4_budget_partial_needs_approval
scenario: S4
title: "Not enough budget left for the full need"
description: >
  The store needs 760 units ($912) but only $600 of budget is left. Buying within budget leaves
  a stockout risk at the end of the cycle; buying the full need breaks the budget. Both are soft
  constraints, so a human must approve whichever the agent proposes.
today: 2026-11-02
now_hour: 10

world:
  nodes:
    - {id: CHAP, name: Chapinero, city: Bogotá}
  storage_zones:
    - {node: CHAP, zone: chilled, capacity_l: 2000, other_skus_used_l: 600}
  skus:
    - {id: MILK1L, name: "Whole milk 1L", category: dairy, zone: chilled, unit_volume_l: 1.0,
       shelf_life_days: 14, criticality: high, unit_margin: 0.40, review_period_days: 7}
  inventory:
    - {node: CHAP, sku: MILK1L, on_hand: 400, last_counted_days_ago: 1, remaining_shelf_life_days: 8}
  forecasts:
    - {node: CHAP, sku: MILK1L, units_per_day: 100, sigma: 30, days: 30}
  sales_history:
    - {node: CHAP, sku: MILK1L, daily: [97, 104, 99, 95, 108, 102, 96, 101, 99, 103, 94, 100, 105, 98]}
  suppliers:
    - {id: SUP_A, name: "Andes Dairy", fill_rate: 0.97, on_time_rate: 0.95, cutoff_hour: 14}
  supplier_terms:
    - {supplier: SUP_A, sku: MILK1L, unit_cost: 1.20, moq: 500, case_pack: 20, lead_time_days: 3,
       remaining_shelf_life_days: 12}
  budgets:
    - {node: CHAP, category: dairy, total: 1100, committed: 500}   # 600 left

trigger:
  type: recommendation
  recommendation: {id: REC-402, node: CHAP, sku: MILK1L, qty: 760, supplier: SUP_A}

expected:
  decision: [accept, modify]
  qty_range: [500, 760]
  lines: 1
  required_tools: [get_inventory, get_budget, get_supplier_terms]
  approval_required: true
  approval_response: approve
  pos_created: 1
  final_verification: [OK, DEGRADED_OK]
  key_factors: [budget]
  notes: |
    Need = 1157 − 400 = 757 → 760 → $912 > $600 left → soft "budget" violation.
    Within budget: 500 (MOQ) = $600 → day-9 close = 400 + 500 − 1000 = −100 → ~100 lost sales
    on days 8–9 → soft "below safety stock" violation.
    Either way the plan breaks a soft rule → human approval is required before any PO.

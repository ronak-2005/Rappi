id: s3_promo_spike_temporary
scenario: S3
title: "Sales up 60%, but it's a promotion that ends today"
description: >
  Sales were ~160/day for 5 days during a 2-for-1 promotion that ends today. Planning the whole horizon on 160/day would overbuy ~500 units; the right call is to keep the current plan.
today: 2026-11-02
now_hour: 10

world:
  nodes:
    - {id: CHAP, name: Chapinero, city: Bogotá}
  storage_zones:
    - {node: CHAP, zone: chilled, capacity_l: 1600, other_skus_used_l: 600}
  skus:
    - {id: MILK1L, name: "Whole milk 1L", category: dairy, zone: chilled, unit_volume_l: 1.0,
       shelf_life_days: 14, criticality: high, unit_margin: 0.40, review_period_days: 7}
  inventory:
    - {node: CHAP, sku: MILK1L, on_hand: 400, last_counted_days_ago: 1, remaining_shelf_life_days: 8}
  forecasts:
    - {node: CHAP, sku: MILK1L, units_per_day: 100, sigma: 30, days: 30}
  sales_history:
    - {node: CHAP, sku: MILK1L, daily: [100, 98, 103, 99, 101, 97, 104, 102, 99, 158, 163, 160, 157, 162]}
  suppliers:
    - {id: SUP_A, name: "Andes Dairy", fill_rate: 0.97, on_time_rate: 0.95, cutoff_hour: 14}
  supplier_terms:
    - {supplier: SUP_A, sku: MILK1L, unit_cost: 1.20, moq: 500, case_pack: 20, lead_time_days: 3,
       remaining_shelf_life_days: 12}
  open_pos:
    - {id: PO-4001, node: CHAP, sku: MILK1L, supplier: SUP_A, qty: 850, unit_cost: 1.20,
       arrives_in_days: 2, ordered_days_ago: 1, remaining_shelf_life_days: 12}
  budgets:
    - {node: CHAP, category: dairy, total: 2000, committed: 480}
  promotions:
    - {node: CHAP, sku: MILK1L, starts_in_days: -5, ends_in_days: 0, uplift_pct: 60, description: "Milk 2-for-1"}

trigger:
  type: demand_alert
  demand_alert:
    id: AL-RARY
    node: CHAP
    sku: MILK1L
    message: "Sales of MILK1L at CHAP were 60% above forecast for the last 5 days."

expected:
  decision: [accept]
  qty_range: [0, 0]
  required_tools: [get_sales_history, get_promotions, analyze_demand, get_open_pos, get_inventory]
  approval_required: false
  pos_created: 0
  notes: |
    analyze_demand: 5 elevated days, all inside the promotion that ends today → promotion;
    suggested assumption 160/day for day 0 only, then the forecast.
    Need = (160 + 9 × 100) + 157 − (400 + 850 PO) = −33 → keep the plan.
    Day 2 storage = 140 + 850 = 990 L ≤ 1000 L. Day-9 close = 1250 − 1060 = 190 ≥ 157.
    Naive 160/day for 10 days: need = 1757 − 1250 = 507 → would buy 520 for nothing.

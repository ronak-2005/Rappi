id: s4_timeout_retry_idempotent
scenario: S4
title: "Supplier API times out after receiving the order"
description: >
  The supplier registers the PO but the response is lost (timeout). A naive retry would create a
  duplicate order. The gateway must retry with the same idempotency key so exactly one PO exists
  on both sides.
today: 2026-11-02
now_hour: 10

world:
  nodes:
    - {id: CHAP, name: Chapinero, city: Bogotá}
  storage_zones:
    - {node: CHAP, zone: chilled, capacity_l: 2000, other_skus_used_l: 600}
  skus:
    - {id: MILK1L, name: "Whole milk 1L", category: dairy, zone: chilled, unit_volume_l: 1.0,
       shelf_life_days: 14, criticality: high, unit_margin: 0.40, review_period_days: 7}
  inventory:
    - {node: CHAP, sku: MILK1L, on_hand: 400, last_counted_days_ago: 1, remaining_shelf_life_days: 8}
  forecasts:
    - {node: CHAP, sku: MILK1L, units_per_day: 100, sigma: 30, days: 30}
  sales_history:
    - {node: CHAP, sku: MILK1L, daily: [97, 104, 99, 95, 108, 102, 96, 101, 99, 103, 94, 100, 105, 98]}
  suppliers:
    - {id: SUP_A, name: "Andes Dairy", fill_rate: 0.97, on_time_rate: 0.95, cutoff_hour: 14}
  supplier_terms:
    - {supplier: SUP_A, sku: MILK1L, unit_cost: 1.20, moq: 500, case_pack: 20, lead_time_days: 3,
       express_lead_days: 1, express_premium_per_unit: 0.30, remaining_shelf_life_days: 12}
  budgets:
    - {node: CHAP, category: dairy, total: 2000, committed: 500}

trigger:
  type: recommendation
  recommendation: {id: REC-406, node: CHAP, sku: MILK1L, qty: 760, supplier: SUP_A}

supplier_behaviour:
  SUP_A: {mode: timeout_once}

expected:
  decision: [accept]
  qty_range: [760, 760]
  lines: 1
  supplier: SUP_A
  approval_required: false
  pos_created: 1
  supplier_orders: 1
  final_verification: [OK]
  key_factors: [coverage_ok]
  notes: |
    Same numbers as s1_accept. The first supplier call stores the order and then times out; the
    retry with the same idempotency key returns the stored confirmation → 1 PO here, 1 at the supplier.

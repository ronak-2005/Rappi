id: s1_modify_open_po_ignored
scenario: S1
title: "Recommendation of 800 ignores an open PO"
description: >
  The replenishment engine recommends buying 800 units of milk for Chapinero. It forgot the
  400 units already arriving in 2 days. 800 would also break the budget and overflow the
  chilled room on delivery day.
today: 2026-11-02
now_hour: 10

world:
  nodes:
    - {id: CHAP, name: Chapinero, city: Bogotá}
  storage_zones:
    - {node: CHAP, zone: chilled, capacity_l: 1500, other_skus_used_l: 600}   # 900 L free
  skus:
    - {id: MILK1L, name: "Whole milk 1L", category: dairy, zone: chilled, unit_volume_l: 1.0,
       shelf_life_days: 14, criticality: high, unit_margin: 0.40, review_period_days: 7}
  inventory:
    - {node: CHAP, sku: MILK1L, on_hand: 300, last_counted_days_ago: 1, remaining_shelf_life_days: 6}
  forecasts:
    - {node: CHAP, sku: MILK1L, units_per_day: 100, sigma: 30, days: 30}
  sales_history:
    - {node: CHAP, sku: MILK1L, daily: [97, 104, 99, 95, 108, 102, 96, 101, 99, 103, 94, 100, 105, 98]}
  suppliers:
    - {id: SUP_A, name: "Andes Dairy", fill_rate: 0.97, on_time_rate: 0.95, cutoff_hour: 14}
  supplier_terms:
    - {supplier: SUP_A, sku: MILK1L, unit_cost: 1.20, moq: 500, case_pack: 20, lead_time_days: 3,
       express_lead_days: 1, express_premium_per_unit: 0.30, remaining_shelf_life_days: 12}
  open_pos:
    - {id: PO-1001, node: CHAP, sku: MILK1L, supplier: SUP_A, qty: 400, unit_cost: 1.20,
       arrives_in_days: 2, ordered_days_ago: 1, remaining_shelf_life_days: 12}
  budgets:
    - {node: CHAP, category: dairy, total: 1180, committed: 480}   # 700 left

trigger:
  type: recommendation
  recommendation: {id: REC-101, node: CHAP, sku: MILK1L, qty: 800, supplier: SUP_A}

expected:
  decision: [modify]
  qty_range: [500, 500]
  lines: 1
  supplier: SUP_A
  required_tools: [get_inventory, get_open_pos, get_supplier_terms, get_budget, get_storage_status]
  approval_required: false
  pos_created: 1
  final_verification: [OK]
  key_factors: [open_po_ignored, budget, storage]
  notes: |
    Horizon = lead 3 + review 7 = 10 days → demand 1000.
    Safety stock = 1.65 × √(10 × 30²) = 156.5 → 157.
    Need = 1000 + 157 − (300 on hand + 400 open PO) = 457 → MOQ 500 (multiple of case 20).
    800 ≈ 1157 − 300: the recommendation ignored PO-1001.
    Budget: 500 × 1.20 = 600 ≤ 700 left; 800 × 1.20 = 960 > 700.
    Storage on arrival (day 3, before sales): 400 + 500 = 900 L ≤ 900 L free; 800 → 1200 L.
    Day-9 close = 300 + 400 + 500 − 1000 = 200 ≥ SS 157.

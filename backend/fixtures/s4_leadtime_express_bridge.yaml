  notes: |
    Need = 1000 + 157 − 150 = 1007 → 1020.
    Standard only (arrives day 3): day 0 close 50; day 1 short 50; day 2 short 100 → 150 lost sales.
    Bridge must keep stock ≥ safety stock until the standard delivery (not just ≥ 0):
      express arrives day 1 with 50 left; days 1–2 demand 200; day-2 close must be ≥ 157
      → bridge ≥ 200 + 157 − 50 = 307 → case 20 → 320.
    Standard: 1020 − 320 = 700 on day 3. Day 3 storage = 170 + 700 = 870 L ≤ 1400 L.
    Express premium = 320 × 0.30 = $96 (≤ $150 approval threshold); all-express = $306 → needs approval.
    Day-9 close = 150 + 1020 − 1000 = 170 ≥ 157.

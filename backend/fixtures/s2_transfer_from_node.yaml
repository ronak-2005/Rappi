id: s2_transfer_from_node
scenario: S2
title: "Shortfall: a nearby store can spare the stock"
description: >
  Andes Dairy delivers only 250 of 500. The other supplier needs 6 days (stock runs out before that). Usaquén has far more milk than it needs: a 1-day transfer is the fastest and cheapest fix.
today: 2026-11-02
now_hour: 10

world:
  nodes:
    - {id: CHAP, name: Chapinero, city: Bogotá, transfer_lead_days: 1, transfer_cost_per_unit: 0.05}
    - {id: USAQ, name: Usaquén, city: Bogotá, transfer_lead_days: 1, transfer_cost_per_unit: 0.05}
  storage_zones:
    - {node: CHAP, zone: chilled, capacity_l: 1600, other_skus_used_l: 600}   # 1000 L free
    - {node: USAQ, zone: chilled, capacity_l: 3000, other_skus_used_l: 600}
  skus:
    - {id: MILK1L, name: "Whole milk 1L", category: dairy, zone: chilled, unit_volume_l: 1.0,
       shelf_life_days: 14, criticality: high, unit_margin: 0.40, review_period_days: 7}
  inventory:
    - {node: CHAP, sku: MILK1L, on_hand: 300, last_counted_days_ago: 1, remaining_shelf_life_days: 6}
    - {node: USAQ, sku: MILK1L, on_hand: 2000, last_counted_days_ago: 1, remaining_shelf_life_days: 12}
  forecasts:
    - {node: CHAP, sku: MILK1L, units_per_day: 100, sigma: 30, days: 30}
    - {node: USAQ, sku: MILK1L, units_per_day: 80, sigma: 25, days: 30}
  sales_history:
    - {node: CHAP, sku: MILK1L, daily: [97, 104, 99, 95, 108, 102, 96, 101, 99, 103, 94, 100, 105, 98]}
  suppliers:
    - {id: SUP_A, name: "Andes Dairy", fill_rate: 0.97, on_time_rate: 0.95, cutoff_hour: 14}
    - {id: SUP_B, name: "Lácteos del Valle", fill_rate: 0.95, on_time_rate: 0.93, cutoff_hour: 15}
  supplier_terms:
    - {supplier: SUP_A, sku: MILK1L, unit_cost: 1.20, moq: 500, case_pack: 20, lead_time_days: 3,
       remaining_shelf_life_days: 12}
    - {supplier: SUP_B, sku: MILK1L, unit_cost: 1.35, moq: 100, case_pack: 20, lead_time_days: 6,
       remaining_shelf_life_days: 12}
  open_pos:
    - {id: PO-3001, node: CHAP, sku: MILK1L, supplier: SUP_A, qty: 500, unit_cost: 1.20, arrives_in_days: 2,
       ordered_days_ago: 2, status: sent, remaining_shelf_life_days: 12}
  budgets:
    - {node: CHAP, category: dairy, total: 1500, committed: 300}

trigger:
  type: supplier_event
  supplier_event:
    id: EV-NODE
    po_id: PO-3001
    confirmed_qty: 250
    message: "Due to a production problem we can only deliver 250 of the 500 units of PO-3001 on the agreed date. We cannot supply more milk this month."

expected:
  decision: [modify]
  qty_range: [0, 0]
  transfers: 1
  transfer_qty_range: [600, 640]
  required_tools: [get_inventory, get_open_pos, get_other_nodes_stock, get_supplier_terms]
  approval_required: false
  pos_created: 0
  notes: |
    Position = 300 + 250 = 550 → need = 1157 − 550 = 607.
    Usaquén: 80/day, SS = 1.65 × 25 × √10 = 130.4 → 131; own need 800 + 131 = 931; spare = 2000 − 931 = 1069.
    Transfer 607 arrives day 1: day 1 = 200 + 607 = 807 L, day 2 = 707 + 250 = 957 L ≤ 1000 L.
    Day-9 close = 300 + 250 + 607 − 1000 = 157 ≥ SS 157.
    SUP_B (6 days) alone: day 5 short 50 units → avoidable stockout. SUP_A is unavailable this month.
